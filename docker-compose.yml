services:
  nginx_foncier:
    container_name: nginx_foncier
    image: nginx:latest
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      docker: "true"
    ports:
      - "${NGINX_PORT}:80"
    expose:
      - "${NGINX_PORT}"
    networks:
      - network_foncier_tdc
    restart: always
    depends_on:
      - api_foncier
  api_foncier:
    container_name: api_foncier
    build:
      context: docker
      dockerfile: Dockerfile
    ports:
      - "9003:9000"
    volumes:
      - /var/www/epa/foncier/foncier_back:/var/www/html
      - ./docker/php:/usr/local/etc/php
    networks:
      - network_foncier_tdc
      - postgres
    restart: always
volumes:
  db-data:

networks:
  network_foncier_tdc:
    external: true
  postgres:
    external: true
